                <label for="passwordInput" class="form-label fw-semibold small text-secondary">Password</label>

            </button>
        </form>
    </div>
</div>

<div class="text-center mt-4 footer-copyright">

</div>

            </div>
            <div class="modal-body">
                <div id="modalAlert" class="alert d-none small py-2" role="alert"></div>
                <form id="formChangePassword">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Username (NIK)</label>
                        <input type="text" id="changeUsername" class="form-control form-control-sm" placeholder="Contoh: DMB11xxxxxx" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Password Lama</label>
                        <input type="password" id="oldPassword" class="form-control form-control-sm" required>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <button type="button" class="btn btn-light btn-sm fw-medium" data-bs-dismiss="modal">Batal</button>
                        <button type="submit" id="btnSubmitChangePassword" class="btn btn-primary btn-sm fw-medium">
                            <span id="btnChangeText">Simpan Password</span>
                            <span id="btnChangeSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js"></script>

</body>
