<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - DMB ERP SYSTEM</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="wrapper">

    <aside id="sidebar">
        <div class="sidebar-brand">
            <i class="fa-solid fa-layer-group text-primary me-2"></i>
            <span>DMB ERP SYSTEM</span>
        </div>
        <ul class="sidebar-menu" id="dynamicSidebarMenu">
            </ul>
    </aside>

    <div id="main-wrapper">

        <header id="header">
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-sm btn-light d-lg-none me-1" id="sidebarToggle" onclick="document.getElementById('sidebar').classList.toggle('show')">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <img src="assets/images/logo-dmb.jpg" alt="Logo DMB" class="header-logo-img" onerror="this.style.display='none'">
                <h6 class="mb-0 fw-semibold text-secondary small">Control & Management Center</h6>
            </div>

            <div class="dropdown">
                <button class="btn btn-light dropdown-toggle d-flex align-items-center py-1 px-2 border-0 bg-transparent" type="button" data-bs-toggle="dropdown">
                    <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center me-2" style="width: 34px; height: 34px; font-weight: 600; font-size: 0.85rem;">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div class="text-start me-2 d-none d-sm-block">
                        <div class="fw-bold small lh-1" id="headerUserName">Loading...</div>
                        <div class="text-muted" style="font-size: 0.72rem;" id="headerUserRole">User</div>
                    </div>
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 mt-2">
                    <li><a class="dropdown-item small" href="#" onclick="alert('Fitur profil sedang disiapkan.')"><i class="fa-solid fa-id-card me-2 text-muted"></i>Profil Saya</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item small text-danger fw-bold" href="#" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket me-2"></i>Keluar (Logout)</a></li>
                </ul>
            </div>
        </header>

        <main class="content-body">

            <div class="card border-0 text-white mb-4 shadow-sm" style="border-radius: 12px; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);">
                <div class="card-body p-4">
                    <h5 class="fw-bold mb-1">Selamat Datang, <span id="welcomeName">User</span>!</h5>
                    <p class="mb-0 opacity-75 small">Anda terhubung ke Control Panel DMB ERP SYSTEM (PT. Duta Makmur Bersama).</p>
                </div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-12 col-sm-6 col-xl-3">
                    <div class="stat-card d-flex align-items-center">
                        <div class="stat-icon bg-primary-subtle text-primary me-3">
                            <i class="fa-solid fa-users"></i>
                        </div>
                        <div>
                            <div class="text-muted small fw-medium">Total Karyawan Aktif</div>
                            <h5 class="fw-bold mb-0" id="statTotalEmp">0</h5>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-sm-6 col-xl-3">
                    <div class="stat-card d-flex align-items-center">
                        <div class="stat-icon bg-success-subtle text-success me-3">
                            <i class="fa-solid fa-map-location-dot"></i>
                        </div>
                        <div>
                            <div class="text-muted small fw-medium">Cakupan Wilayah</div>
                            <h6 class="fw-bold mb-0 text-dark" id="statAreaScope">Memuat...</h6>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-sm-6 col-xl-3">
                    <div class="stat-card d-flex align-items-center">
                        <div class="stat-icon bg-warning-subtle text-warning me-3">
                            <i class="fa-solid fa-clock-rotate-left"></i>
                        </div>
                        <div>
                            <div class="text-muted small fw-medium">Pending Approvals</div>
                            <h5 class="fw-bold mb-0">0</h5>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-sm-6 col-xl-3">
                    <div class="stat-card d-flex align-items-center">
                        <div class="stat-icon bg-info-subtle text-info me-3">
                            <i class="fa-solid fa-file-contract"></i>
                        </div>
                        <div>
                            <div class="text-muted small fw-medium">Kontrak Jatuh Tempo</div>
                            <h5 class="fw-bold mb-0">0</h5>
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
