<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Data - DMB ERP SYSTEM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .nav-pills .nav-link { color: #64748b; font-weight: 500; border-radius: 8px; padding: 8px 16px; font-size: 0.88rem; }
        .nav-pills .nav-link.active { background-color: #0d6efd; color: #ffffff; font-weight: 600; }
    </style>
</head>
<body>
<div id="wrapper">
    <aside id="sidebar">
        <div class="sidebar-brand">
            <i class="fa-solid fa-layer-group text-primary me-2"></i>
            <span>DMB ERP SYSTEM</span>
        </div>
        <ul class="sidebar-menu" id="dynamicSidebarMenu">
            </ul>
    </aside>

    <div id="main-wrapper">
        <header id="header">
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-sm btn-light d-lg-none me-1" id="sidebarToggle" onclick="document.getElementById('sidebar').classList.toggle('show')"><i class="fa-solid fa-bars"></i></button>
                <img src="../../assets/images/logo-dmb.jpg" alt="Logo" class="header-logo-img" onerror="this.style.display='none'">
                <h6 class="mb-0 fw-semibold text-secondary small">Control & Management Center</h6>
            </div>
            <div class="dropdown">
                <button class="btn btn-light py-1 px-2 border-0 bg-transparent dropdown-toggle" type="button" data-bs-toggle="dropdown">
                    <i class="fa-solid fa-user text-primary me-1"></i> Admin
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 mt-2">
                    <li><a class="dropdown-item small text-danger fw-bold" href="#" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket me-2"></i>Keluar</a></li>
                </ul>
            </div>
        </header>

        <main class="content-body">
            <div class="mb-3">
                <h5 class="fw-bold text-dark mb-0">Pusat Pengaturan Master Data</h5>
            </div>

            <ul class="nav nav-pills gap-1 bg-white p-2 rounded-3 border shadow-sm mb-3 overflow-x-auto flex-nowrap" id="masterTab">
                <li class="nav-item"><button class="nav-link active" onclick="switchMasterTab('branches')"><i class="fa-solid fa-building me-1"></i> Cabang</button></li>
                <li class="nav-item"><button class="nav-link" onclick="switchMasterTab('departments')"><i class="fa-solid fa-sitemap me-1"></i> Departemen</button></li>
                <li class="nav-item"><button class="nav-link" onclick="switchMasterTab('cost_centers')"><i class="fa-solid fa-calculator me-1"></i> Cost Center</button></li>
                <li class="nav-item"><button class="nav-link" onclick="switchMasterTab('jabatans')"><i class="fa-solid fa-user-tie me-1"></i> Jabatan</button></li>
                <li class="nav-item"><button class="nav-link" onclick="switchMasterTab('bagians')"><i class="fa-solid fa-layer-group me-1"></i> Bagian</button></li>
                <li class="nav-item"><button class="nav-link" onclick="switchMasterTab('areas')"><i class="fa-solid fa-map-location-dot me-1"></i> Area Kerja</button></li>
                <li class="nav-item"><button class="nav-link" onclick="switchMasterTab('zonas')"><i class="fa-solid fa-earth-asia me-1"></i> Zona</button></li>
                <li class="nav-item"><button class="nav-link" onclick="switchMasterTab('supervisor_zones')"><i class="fa-solid fa-user-shield me-1"></i> Zona Supervisor</button></li>
            </ul>

            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center border-bottom flex-wrap gap-2">
                    <h6 class="fw-bold mb-0 text-dark" id="masterTableTitle"><i class="fa-solid fa-list me-2"></i>Daftar Cabang</h6>
                    
                    <div class="d-flex align-items-center gap-2">
                        <div class="input-group input-group-sm" style="width: 150px;">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-filter"></i></span>
                            <select id="filterStatus" class="form-select form-select-sm" onchange="renderMasterTable()">
                                <option value="active" selected>Data Aktif</option>
                                <option value="inactive">Non-Aktif</option>
                                <option value="all">Semua Status</option>
                            </select>
                        </div>
                        <button class="btn btn-primary btn-sm fw-semibold" onclick="openCreateMasterModal()"><i class="fa-solid fa-plus me-1"></i>Tambah Data</button>
                    </div>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="bg-light"><tr id="masterTableHeader"></tr></thead>
                            <tbody id="masterTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div class="modal fade" id="modalMasterForm" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header border-bottom py-2">
                <h6 class="modal-title fw-bold" id="modalMasterTitle">Tambah Master Data</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="formMaster">
                <input type="hidden" id="master_id">
                <div class="modal-body" id="modalMasterFields"></div>
                <div class="modal-footer border-top py-2">
                    <button type="button" class="btn btn-light btn-sm fw-medium" data-bs-dismiss="modal">Batal</button>
                    <button type="submit" class="btn btn-primary btn-sm fw-semibold" id="btnSaveMaster">Simpan</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/supabase.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/sidebar.js"></script>
<script src="../../js/module/settings/master_data.js"></script>
</body>
</html>
