<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titik Patroli - DMB ERP</title>

    <!-- ============================================================
         KELOMPOK 1: LIBRARY & STYLE
         Fungsi: ikon Font Awesome, font Inter, CSS proyek, dan seluruh gaya
         halaman. Semua kelas halaman berawalan "tp-" (titik patroli) supaya
         tidak bentrok dengan kelas di base.css / components.css / layout.css
         / style.css.
         PERLU DICEK: path ../../../css/ saya tebak (halaman berada 3 tingkat
         di dalam modules/operations/security/).
         ============================================================ -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link href="../../../css/base.css" rel="stylesheet">
    <link href="../../../css/components.css" rel="stylesheet">
    <link href="../../../css/layout.css" rel="stylesheet">
    <link href="../../../css/style.css" rel="stylesheet">

    <style>
        :root {
            --tp-primary: #2b6cb0;
            --tp-primary-dark: #1e4e8c;
            --tp-bg-soft: #e1ecf5;
            --tp-border: #d3dfea;
            --tp-text-main: #1f2d3d;
            --tp-text-muted: #6b7c93;
            --tp-danger: #d64545;
            --tp-danger-dark: #b83737;
            --tp-radius: 8px;
            --tp-head-h: 40px;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            display: flex;
            flex-direction: column;
            font-family: 'Inter', sans-serif;
            background: #f4f7fb;
            color: var(--tp-text-main);
        }

        /* --- Bar atas: Kembali (kiri) + judul (tengah) + tab cabang (kanan) ---
           Grid 3 kolom dengan posisi tetap: judul selalu di tengah walau tab disembunyikan. */
        .tp-topbar {
            display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px;
            padding: 14px 24px; background: #fff; border-bottom: 1px solid var(--tp-border); flex-shrink: 0;
        }
        .tp-topbar .btn-back { grid-column: 1; justify-self: start; }
        .btn-back {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 8px 16px; border-radius: var(--tp-radius);
            border: 1px solid var(--tp-border); background: var(--tp-bg-soft);
            color: var(--tp-primary-dark); font-size: 14px; font-weight: 600; text-decoration: none;
            transition: background 0.15s ease;
        }
        .btn-back:hover { background: var(--tp-primary); color: #fff; }

        .tp-title-block { grid-column: 2; text-align: center; }
        .tp-title { margin: 0; font-size: 24px; font-weight: 700; }
        .tp-subtitle { margin-top: 2px; font-size: 16px; font-weight: 600; color: var(--tp-primary); }

        .tp-tabs { grid-column: 3; justify-self: end; display: flex; gap: 6px; background: var(--tp-bg-soft); padding: 4px; border-radius: 10px; }
        .tp-tabs[hidden] { display: none; }
        .tp-tab {
            border: none; background: transparent; padding: 7px 20px; border-radius: 7px;
            font-size: 14px; font-weight: 600; color: var(--tp-text-muted); cursor: pointer; font-family: inherit;
        }
        .tp-tab:hover { color: var(--tp-primary-dark); }
        .tp-tab.active { background: var(--tp-primary); color: #fff; }

        /* --- Area utama --- */
        .tp-main { display: flex; flex-direction: column; flex: 1; min-height: 0; padding: 16px 24px; overflow: hidden; }

        /* --- Toolbar: search (kiri), Tambah Titik Patroli (kanan) --- */
        .tp-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-shrink: 0; }
        .tp-search-wrapper { position: relative; flex: 1; max-width: 360px; min-width: 200px; }
        .tp-search-wrapper i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--tp-text-muted); font-size: 13px; }
        .tp-search-input {
            width: 100%; border: 1px solid var(--tp-border); border-radius: var(--tp-radius);
            padding: 8px 12px 8px 34px; font-size: 14px; outline: none; background: #fff; font-family: inherit;
        }
        .tp-search-input:focus { border-color: var(--tp-primary); }

        .tp-btn-primary {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 8px 16px; border-radius: var(--tp-radius); border: 1px solid var(--tp-primary);
            background: var(--tp-primary); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
        }
        .tp-btn-primary:hover { background: var(--tp-primary-dark); border-color: var(--tp-primary-dark); }
        .tp-btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .tp-toolbar-right { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 10px; }
        .tp-btn-outline {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 8px 16px; border-radius: var(--tp-radius); border: 1px solid var(--tp-primary);
            background: #fff; color: var(--tp-primary-dark); font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
        }
        .tp-btn-outline:hover { background: var(--tp-bg-soft); }
        .tp-btn-outline:disabled { opacity: 0.6; cursor: not-allowed; }
        .tp-btn-outline[hidden] { display: none; }
        .tp-btn-plain {
            padding: 8px 16px; border-radius: var(--tp-radius); border: 1px solid var(--tp-border);
            background: #fff; font-size: 14px; cursor: pointer; font-family: inherit; color: var(--tp-text-main);
        }
        .tp-btn-plain:hover { border-color: var(--tp-primary); }
        .tp-btn-danger {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 8px 16px; border-radius: var(--tp-radius); border: 1px solid var(--tp-danger);
            background: var(--tp-danger); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
        }
        .tp-btn-danger:hover { background: var(--tp-danger-dark); border-color: var(--tp-danger-dark); }
        .tp-btn-danger:disabled { opacity: 0.6; cursor: not-allowed; }

        /* --- Tabel (header sticky) --- */
        .tp-table-wrapper {
            background: #fff; border: 1px solid var(--tp-border); border-radius: var(--tp-radius);
            overflow: auto; flex: 1; min-height: 0;
        }
        .tp-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13.5px; }
        .tp-table thead th {
            position: sticky; top: 0; z-index: 10; height: var(--tp-head-h);
            background: var(--tp-bg-soft); color: var(--tp-text-main);
            font-weight: 600; text-align: left; padding: 0 14px; white-space: nowrap;
            border-bottom: 2px solid var(--tp-border);
        }
        .tp-table tbody td { padding: 9px 14px; border-bottom: 1px solid var(--tp-border); vertical-align: middle; white-space: nowrap; }
        .tp-table tbody tr:hover { background: #f7fafc; }
        .col-no { width: 50px; text-align: center !important; }
        .col-center { text-align: center !important; }
        .col-check { width: 44px; text-align: center !important; }
        .col-check input { width: 16px; height: 16px; cursor: pointer; accent-color: var(--tp-primary); vertical-align: middle; }
        .row-loading td, .row-empty td { text-align: center !important; padding: 30px !important; color: var(--tp-text-muted); white-space: normal !important; }
        .data-empty-cell { color: var(--tp-text-muted); font-style: italic; }
        .tp-count { margin-top: 10px; font-size: 12.5px; color: var(--tp-text-muted); text-align: right; flex-shrink: 0; min-height: 18px; }

        /* --- Tombol kecil di dalam tabel --- */
        .tp-icon-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 5px 12px; border-radius: 6px; border: 1px solid var(--tp-border);
            background: #fff; font-size: 12.5px; font-weight: 600; cursor: pointer; font-family: inherit; color: var(--tp-text-main);
        }
        .tp-icon-btn:hover { border-color: var(--tp-primary); color: var(--tp-primary-dark); }
        .tp-icon-btn.danger:hover { border-color: var(--tp-danger); color: var(--tp-danger); }
        .tp-actions { display: inline-flex; gap: 6px; }

        /* --- Modal --- */
        .tp-overlay {
            position: fixed; inset: 0; z-index: 200; background: rgba(31, 45, 61, 0.45);
            display: flex; align-items: center; justify-content: center; padding: 16px;
        }
        .tp-overlay[hidden] { display: none; }
        .tp-modal {
            background: #fff; border-radius: 12px; width: 100%; max-width: 460px;
            box-shadow: 0 16px 40px rgba(31, 45, 61, 0.25); overflow: hidden;
        }
        .tp-modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--tp-border); }
        .tp-modal-title { margin: 0; font-size: 17px; font-weight: 700; }
        .tp-modal-close { border: none; background: transparent; font-size: 18px; color: var(--tp-text-muted); cursor: pointer; padding: 4px 8px; }
        .tp-modal-close:hover { color: var(--tp-text-main); }
        .tp-modal-body { padding: 18px 20px; }
        .tp-modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; background: #f8fafc; border-top: 1px solid var(--tp-border); }
        .tp-field { margin-bottom: 14px; }
        .tp-field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--tp-text-muted); margin-bottom: 4px; }
        .tp-field input, .tp-field select {
            width: 100%; border: 1px solid var(--tp-border); border-radius: var(--tp-radius);
            padding: 9px 11px; font-size: 14px; font-family: inherit; background: #fff; color: var(--tp-text-main); outline: none;
        }
        .tp-field input:focus, .tp-field select:focus { border-color: var(--tp-primary); }
        .tp-field select:disabled, .tp-field input:disabled { background: #eef2f7; color: var(--tp-text-muted); cursor: not-allowed; }
        .tp-error { color: var(--tp-danger); font-size: 13px; margin-top: 4px; min-height: 18px; }
        .tp-confirm-text { margin: 0; font-size: 14px; line-height: 1.55; }

        /* --- Notifikasi singkat --- */
        .tp-toast {
            position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 300;
            background: var(--tp-text-main); color: #fff; padding: 10px 20px; border-radius: 999px;
            font-size: 13.5px; font-weight: 500; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
        }
        .tp-toast[hidden] { display: none; }

        @media (max-width: 640px) {
            .tp-topbar, .tp-main { padding-left: 12px; padding-right: 12px; }
            .tp-title { font-size: 20px; }
            .tp-toolbar { flex-wrap: wrap; }
        }
    </style>
</head>
<body>

    <!-- ============================================================
         KELOMPOK 2: BAR ATAS + JUDUL
         Fungsi: tombol "Kembali" ke dashboard-security.html, judul "Titik Patroli"
         dengan nama cabang di bawahnya, dan tab cabang di kanan.
         Tab Makassar = branch_id 2, Surabaya = branch_id 1. Tab hanya tampil
         untuk Maintenance dan Superadmin (diatur titik-patroli.js).
         PERLU DICEK: nama file tujuan tombol Kembali. Jika dashboard Anda
         sekarang bernama security.html, ubah href di bawah.
         ============================================================ -->
    <header class="tp-topbar">
        <a href="../../operations/security/security.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Kembali</a>

        <div class="tp-title-block">
            <h1 class="tp-title">Titik Patroli</h1>
            <div class="tp-subtitle" id="branchTitle">Makassar</div>
        </div>

        <div class="tp-tabs" id="branchTabs" role="tablist" hidden>
            <button type="button" class="tp-tab active" data-branch="2" role="tab">Makassar</button>
            <button type="button" class="tp-tab" data-branch="1" role="tab">Surabaya</button>
        </div>
    </header>

    <main class="tp-main">

        <!-- ========================================================
             KELOMPOK 3: TOOLBAR
             Fungsi: kiri = pencarian (nama titik patroli dan area),
             kanan = tombol "Download Semua (N)" (muncul hanya jika ada baris
             yang dicentang) dan tombol "Tambah Titik Patroli" (membuka modal).
             ======================================================== -->
        <div class="tp-toolbar">
            <div class="tp-search-wrapper">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" class="tp-search-input" id="searchInput" placeholder="Cari titik patroli atau area..." autocomplete="off">
            </div>
            <div class="tp-toolbar-right">
                <button type="button" class="tp-btn-outline" id="btnDownloadAll" hidden></button>
                <button type="button" class="tp-btn-primary" id="btnTambah">
                    <i class="fa-solid fa-plus"></i> Tambah Titik Patroli
                </button>
            </div>
        </div>

        <!-- ========================================================
             KELOMPOK 4: TABEL
             Fungsi: daftar titik patroli aktif pada cabang yang dibuka.
             Kolom paling kiri = checkbox untuk memilih beberapa titik sekaligus
             (checkbox di header memilih semua baris yang sedang tampil).
             Kolom Label = tombol unduh PDF label QR Code. Kolom Aksi = Edit
             dan Hapus. Isi tabel dibuat oleh titik-patroli.js.
             ======================================================== -->
        <div class="tp-table-wrapper">
            <table class="tp-table">
                <thead>
                    <tr>
                        <th class="col-check"><input type="checkbox" id="chkAll" title="Pilih semua yang tampil"></th>
                        <th class="col-no">No</th>
                        <th class="col-center">Label</th>
                        <th>Area</th>
                        <th>Titik Patroli</th>
                        <th>Dibuat Oleh</th>
                        <th class="col-center">Aksi</th>
                    </tr>
                </thead>
                <tbody id="titikTableBody">
                    <tr class="row-loading"><td colspan="7"><i class="fa-solid fa-spinner fa-spin"></i> Memuat data...</td></tr>
                </tbody>
            </table>
        </div>
        <div class="tp-count" id="titikCount"></div>
    </main>

    <!-- ============================================================
         KELOMPOK 5: MODAL TAMBAH / EDIT
         Fungsi: satu modal dipakai untuk Tambah dan Edit. Saat Edit, hanya
         Kode dan Nama yang bisa diubah; Cabang dan Area terkunci (diatur JS).
         ============================================================ -->
    <div class="tp-overlay" id="modalForm" hidden>
        <div class="tp-modal" role="dialog" aria-modal="true" aria-labelledby="modalFormTitle">
            <div class="tp-modal-head">
                <h2 class="tp-modal-title" id="modalFormTitle">Tambah Titik Patroli</h2>
                <button type="button" class="tp-modal-close" id="btnFormClose" aria-label="Tutup"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="tp-modal-body">
                <div class="tp-field">
                    <label for="fKode">Kode Titik Patroli</label>
                    <input type="text" id="fKode" autocomplete="off" maxlength="50">
                </div>
                <div class="tp-field">
                    <label for="fNama">Nama Titik Patroli</label>
                    <input type="text" id="fNama" autocomplete="off" maxlength="150">
                </div>
                <div class="tp-field">
                    <label for="fBranch">Cabang</label>
                    <select id="fBranch"></select>
                </div>
                <div class="tp-field">
                    <label for="fArea">Area</label>
                    <select id="fArea"></select>
                </div>
                <div class="tp-error" id="formError"></div>
            </div>
            <div class="tp-modal-foot">
                <button type="button" class="tp-btn-plain" id="btnFormCancel">Batal</button>
                <button type="button" class="tp-btn-primary" id="btnFormSave">Simpan</button>
            </div>
        </div>
    </div>

    <!-- ============================================================
         KELOMPOK 6: MODAL KONFIRMASI HAPUS
         Fungsi: meminta konfirmasi sebelum titik dinonaktifkan (soft delete:
         is_active menjadi false, data dan riwayat patroli tetap tersimpan).
         ============================================================ -->
    <div class="tp-overlay" id="modalDelete" hidden>
        <div class="tp-modal" role="dialog" aria-modal="true" aria-labelledby="modalDeleteTitle">
            <div class="tp-modal-head">
                <h2 class="tp-modal-title" id="modalDeleteTitle">Hapus Titik Patroli</h2>
                <button type="button" class="tp-modal-close" id="btnDeleteClose" aria-label="Tutup"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="tp-modal-body">
                <p class="tp-confirm-text" id="deleteText"></p>
                <div class="tp-error" id="deleteError"></div>
            </div>
            <div class="tp-modal-foot">
                <button type="button" class="tp-btn-plain" id="btnDeleteCancel">Batal</button>
                <button type="button" class="tp-btn-danger" id="btnDeleteConfirm"><i class="fa-solid fa-trash"></i> Hapus</button>
            </div>
        </div>
    </div>

    <div class="tp-toast" id="toast" hidden></div>

    <!-- ============================================================
         KELOMPOK 7: SCRIPT
         Fungsi: jsPDF (membuat file PDF), qrcode-generator (membuat QR Code),
         Supabase (database), lalu skrip halaman.
         PERLU DICEK: path supabase.js dan titik-patroli.js. Nama file skrip
         harus SAMA PERSIS dengan file Anda (tanda hubung, bukan garis bawah).
         ============================================================ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../../js/supabase.js"></script>
    <script src="../../../js/module/operations/security/titik-patroli.js"></script>
</body>
</html>
