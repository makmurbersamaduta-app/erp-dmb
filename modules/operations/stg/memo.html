<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Memo - DMB ERP</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link href="../../css/base.css" rel="stylesheet">
    <link href="../../css/components.css" rel="stylesheet">
    <link href="../../css/layout.css" rel="stylesheet">
    <link href="../../css/style.css" rel="stylesheet">

    <style>
        :root {
            --mm-primary: #2b6cb0;
            --mm-primary-dark: #1e4e8c;
            --mm-bg-soft: #e1ecf5;
            --mm-border: #d3dfea;
            --mm-text-main: #1f2d3d;
            --mm-text-muted: #6b7c93;
            --mm-radius: 8px;
        }

        html, body { height: 100%; margin: 0; }
        body {
            display: flex;
            flex-direction: column;
            font-family: 'Inter', sans-serif;
            background: #f4f7fb;
            color: var(--mm-text-main);
        }

        /* --- Header --- */
        .mm-header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 24px;
            background: #fff;
            border-bottom: 1px solid var(--mm-border);
            flex-shrink: 0;
        }
        .btn-back {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid var(--mm-border);
            background: var(--mm-bg-soft);
            color: var(--mm-primary-dark);
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s ease;
        }
        .btn-back:hover { background: var(--mm-primary); color: #fff; }
        .mm-header-title { font-size: 18px; font-weight: 600; margin: 0; }

        /* --- Tabs --- */
        .mm-tabs-wrapper {
            padding: 16px 24px 0;
            background: #fff;
            border-bottom: 1px solid var(--mm-border);
            flex-shrink: 0;
        }
        .nav-tabs { border-bottom: none; }
        .nav-tabs .nav-link {
            border: none;
            border-bottom: 3px solid transparent;
            color: var(--mm-text-muted);
            font-weight: 600;
            font-size: 14px;
            padding: 10px 18px;
        }
        .nav-tabs .nav-link.active {
            color: var(--mm-primary-dark);
            border-bottom-color: var(--mm-primary);
            background: none;
        }
        .tab-badge-pending {
            background: #d9822b;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            border-radius: 999px;
            padding: 1px 7px;
            margin-left: 6px;
        }

        /* --- Main --- */
        .mm-main {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            padding: 20px 24px;
            overflow: hidden;
        }
        .tab-content { flex: 1; min-height: 0; display: flex; }
        .tab-pane { display: none; flex-direction: column; flex: 1; min-height: 0; width: 100%; }
        .tab-pane.active { display: flex; }

        /* --- Toolbar --- */
        .mm-toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            flex-shrink: 0;
        }
        .mm-filter-wrapper { position: relative; }
        .btn-filter {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #fff;
            border: 1px solid var(--mm-border);
            border-radius: var(--mm-radius);
            padding: 8px 16px;
            font-size: 14px;
            color: var(--mm-text-main);
            cursor: pointer;
        }
        .btn-filter:hover { border-color: var(--mm-primary); }
        .filter-count-badge {
            background: var(--mm-primary);
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            border-radius: 999px;
            padding: 1px 7px;
        }

        .mm-filter-panel {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            width: 320px;
            background: #fff;
            border: 1px solid var(--mm-border);
            border-radius: var(--mm-radius);
            box-shadow: 0 8px 24px rgba(31, 45, 61, 0.12);
            z-index: 60;
            max-height: 460px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .filter-group { border-bottom: 1px solid var(--mm-border); padding: 12px 14px; }
        .filter-group:last-of-type { border-bottom: none; }
        .filter-group-label {
            font-size: 12.5px;
            font-weight: 700;
            color: var(--mm-text-main);
            margin-bottom: 8px;
            display: block;
        }
        .filter-date-input, .filter-select-input {
            width: 100%;
            border: 1px solid var(--mm-border);
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 13px;
            outline: none;
        }
        .filter-date-input:focus, .filter-select-input:focus { border-color: var(--mm-primary); }
        .filter-date-range { display: flex; align-items: center; gap: 6px; }
        .filter-date-range span { font-size: 12px; color: var(--mm-text-muted); }

        .filter-group-header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: none;
            border: none;
            padding: 0 0 8px 0;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--mm-text-main);
            cursor: pointer;
        }
        .filter-group-header i {
            font-size: 11px;
            color: var(--mm-text-muted);
            transition: transform 0.15s ease;
        }
        .filter-group-header.expanded i { transform: rotate(180deg); }

        .filter-group-body-collapsible { display: none; flex-direction: column; }
        .filter-group-body-collapsible.expanded { display: flex; }

        .filter-inline-search {
            width: 100%;
            border: 1px solid var(--mm-border);
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 12.5px;
            outline: none;
            margin-bottom: 8px;
        }
        .filter-inline-search:focus { border-color: var(--mm-primary); }

        .filter-checkbox-list { max-height: 150px; overflow-y: auto; }
        .filter-checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 0;
            font-size: 13px;
        }
        .filter-checkbox-item input[type="checkbox"] { accent-color: var(--mm-primary); cursor: pointer; }

        .filter-panel-footer {
            display: flex;
            justify-content: space-between;
            padding: 10px 14px;
            border-top: 1px solid var(--mm-border);
            background: var(--mm-bg-soft);
            border-radius: 0 0 var(--mm-radius) var(--mm-radius);
            position: sticky;
            bottom: 0;
        }
        .btn-filter-reset { background: none; border: none; font-size: 13px; color: var(--mm-text-muted); cursor: pointer; }
        .btn-filter-reset:hover { color: #d64545; }
        .btn-filter-apply {
            background: var(--mm-primary);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }
        .btn-filter-apply:hover { background: var(--mm-primary-dark); }

        /* --- Tabel --- */
        .mm-table-wrapper {
            background: #fff;
            border: 1px solid var(--mm-border);
            border-radius: var(--mm-radius);
            overflow: auto;
            flex: 1;
            min-height: 0;
        }
        .mm-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
        .mm-table thead th {
            position: sticky;
            top: 0;
            z-index: 10;
            background: var(--mm-bg-soft);
            color: var(--mm-text-main);
            font-weight: 600;
            text-align: left;
            padding: 12px 14px;
            border-bottom: 2px solid var(--mm-border);
            white-space: nowrap;
        }
        .mm-table tbody td {
            padding: 10px 14px;
            border-bottom: 1px solid var(--mm-border);
            vertical-align: middle;
            white-space: nowrap;
        }
        .mm-table tbody tr:hover { background: #f7fafc; }
        .mm-table tbody tr.row-clickable { cursor: pointer; }
        .col-no { width: 50px; text-align: center; }
        .row-loading td, .row-empty td { text-align: center; padding: 30px; color: var(--mm-text-muted); white-space: normal; }
        .data-empty-cell { color: var(--mm-text-muted); font-style: italic; }

        .badge-status {
            font-size: 11.5px;
            font-weight: 700;
            border-radius: 999px;
            padding: 3px 10px;
            display: inline-block;
        }
        .badge-ditagihkan { background: #e3f4e9; color: #237a37; }
        .badge-tidak-ditagihkan { background: #f1f3f5; color: var(--mm-text-muted); }

        /* --- Pagination --- */
        .mm-pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: 16px;
            flex-shrink: 0;
        }
        .pagination-btn {
            min-width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--mm-border);
            background: #fff;
            border-radius: 6px;
            font-size: 13px;
            color: var(--mm-text-main);
            cursor: pointer;
        }
        .pagination-btn:hover { border-color: var(--mm-primary); }
        .pagination-btn.active { background: var(--mm-primary); border-color: var(--mm-primary); color: #fff; }
        .pagination-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* --- Modal Pending --- */
        .modal-content { border-radius: var(--mm-radius); border: none; }
        .modal-header { border-bottom: 1px solid var(--mm-border); }
        .modal-title { font-size: 16px; font-weight: 700; }
        .form-label { font-size: 13px; font-weight: 600; color: var(--mm-text-main); }
        .form-select:focus, .form-control:focus {
            border-color: var(--mm-primary);
            box-shadow: 0 0 0 0.2rem rgba(43, 108, 176, 0.15);
        }

        @media (max-width: 640px) {
            .mm-filter-panel { width: 100%; left: 0; right: 0; }
        }
    </style>
</head>
<body>

    <header class="mm-header">
        <a href="../../operations/stg/dashboard_stg.html" class="btn-back" title="Kembali">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h1 class="mm-header-title">Data Memo</h1>
    </header>

    <!-- =============================================== -->
    <!-- TABS: Data Memo / Pending                         -->
    <!-- =============================================== -->
    <div class="mm-tabs-wrapper">
        <ul class="nav nav-tabs" id="mmTabs">
            <li class="nav-item">
                <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabDataMemo" type="button">
                    Data Memo
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabPending" type="button">
                    Pending <span class="tab-badge-pending d-none" id="pendingCountBadge">0</span>
                </button>
            </li>
        </ul>
    </div>

    <main class="mm-main">
        <div class="tab-content">

            <!-- =============================================== -->
            <!-- TAB: DATA MEMO (status = disetujui)              -->
            <!-- =============================================== -->
            <div class="tab-pane active" id="tabDataMemo">

                <div class="mm-toolbar">
                    <div class="mm-filter-wrapper">
                        <button type="button" class="btn-filter" id="btnFilterToggleDataMemo">
                            <i class="fa-solid fa-filter"></i>
                            <span>Filter</span>
                            <span class="filter-count-badge d-none" id="filterCountBadgeDataMemo">0</span>
                        </button>

                        <div class="mm-filter-panel d-none" id="filterPanelDataMemo">

                            <!-- Diisi dinamis oleh memo.js: No Absen, Jenis Memo, Jenis Pekerjaan -->
                            <div id="filterFieldGroupsDataMemo"></div>

                            <div class="filter-group">
                                <label class="filter-group-label">Tanggal</label>
                                <div class="filter-date-range">
                                    <input type="date" class="filter-date-input" id="filterTglDariDataMemo">
                                    <span>s/d</span>
                                    <input type="date" class="filter-date-input" id="filterTglSampaiDataMemo">
                                </div>
                            </div>

                            <div class="filter-group">
                                <label class="filter-group-label">Periode</label>
                                <select class="filter-select-input" id="filterPeriodeDataMemo">
                                    <option value="">-- Periode Terbaru --</option>
                                </select>
                            </div>

                            <div class="filter-panel-footer">
                                <button type="button" class="btn-filter-reset" id="btnFilterResetDataMemo">Reset</button>
                                <button type="button" class="btn-filter-apply" id="btnFilterApplyDataMemo">Terapkan</button>
                            </div>
                        </div>
                    </div>

                    <button type="button" class="btn-filter" id="btnDownloadDataMemo">
                        <i class="fa-solid fa-file-arrow-down"></i>
                        <span>Download Excel</span>
                    </button>
                </div>

                <div class="mm-table-wrapper">
                    <table class="mm-table">
                        <thead>
                            <tr>
                                <th class="col-no">No</th>
                                <th>Jenis Memo</th>
                                <th>No Absen</th>
                                <th>Nama Karyawan</th>
                                <th>Bagian</th>
                                <th>Tanggal</th>
                                <th>Jam Kerja</th>
                                <th>Shift</th>
                                <th>Jenis Pekerjaan</th>
                                <th>Deskripsi</th>
                                <th>Upah</th>
                                <th>KARU</th>
                            </tr>
                        </thead>
                        <tbody id="dataMemoTableBody">
                            <tr class="row-loading">
                                <td colspan="12"><i class="fa-solid fa-spinner fa-spin"></i> Memuat data...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="mm-pagination" id="dataMemoPagination"></div>
            </div>

            <!-- =============================================== -->
            <!-- TAB: PENDING (status = pending)                  -->
            <!-- =============================================== -->
            <div class="tab-pane" id="tabPending">

                <div class="mm-toolbar">
                    <div class="mm-filter-wrapper">
                        <button type="button" class="btn-filter" id="btnFilterTogglePending">
                            <i class="fa-solid fa-filter"></i>
                            <span>Filter</span>
                            <span class="filter-count-badge d-none" id="filterCountBadgePending">0</span>
                        </button>

                        <div class="mm-filter-panel d-none" id="filterPanelPending">

                            <!-- Diisi dinamis oleh memo.js: No Absen, Jenis Memo -->
                            <div id="filterFieldGroupsPending"></div>

                            <div class="filter-group">
                                <label class="filter-group-label">Tanggal</label>
                                <div class="filter-date-range">
                                    <input type="date" class="filter-date-input" id="filterTglDariPending">
                                    <span>s/d</span>
                                    <input type="date" class="filter-date-input" id="filterTglSampaiPending">
                                </div>
                            </div>

                            <div class="filter-panel-footer">
                                <button type="button" class="btn-filter-reset" id="btnFilterResetPending">Reset</button>
                                <button type="button" class="btn-filter-apply" id="btnFilterApplyPending">Terapkan</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mm-table-wrapper">
                    <table class="mm-table">
                        <thead>
                            <tr>
                                <th class="col-no">No</th>
                                <th>Jenis Memo</th>
                                <th>No Absen</th>
                                <th>Nama Karyawan</th>
                                <th>Bagian</th>
                                <th>Tanggal</th>
                                <th>Jam Kerja</th>
                                <th>Shift</th>
                                <th>Deskripsi</th>
                                <th>KARU</th>
                            </tr>
                        </thead>
                        <tbody id="pendingTableBody">
                            <tr class="row-loading">
                                <td colspan="10"><i class="fa-solid fa-spinner fa-spin"></i> Memuat data...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="mm-pagination" id="pendingPagination"></div>
            </div>

        </div>
    </main>

    <!-- =============================================== -->
    <!-- MODAL: DETAIL / APPROVE PENDING MEMO              -->
    <!-- =============================================== -->
    <div class="modal fade" id="modalPendingMemo" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Detail Pengajuan Memo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="modalMemoId">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Jenis Memo</label>
                            <select class="form-select" id="modalJenisMemo">
                                <option value="Ditagihkan">Ditagihkan</option>
                                <option value="Tidak Ditagihkan">Tidak Ditagihkan</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">No Absen</label>
                            <input type="text" class="form-control bg-light" id="modalNoAbsen" readonly>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Nama Karyawan</label>
                            <input type="text" class="form-control bg-light" id="modalNamaKaryawan" readonly>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Bagian</label>
                            <input type="text" class="form-control bg-light" id="modalBagian" readonly>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Tanggal</label>
                            <input type="text" class="form-control bg-light" id="modalTanggal" readonly>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Jam Kerja</label>
                            <input type="text" class="form-control" id="modalJamKerja">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Shift</label>
                            <input type="text" class="form-control bg-light" id="modalShift" readonly>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Jenis Pekerjaan</label>
                            <select class="form-select" id="modalJenisPekerjaan">
                                <option value="Produksi">Produksi</option>
                                <option value="Revisi Palet">Revisi Palet</option>
                                <option value="Printech">Printech</option>
                                <option value="Revisi QC STG 2">Revisi QC STG 2</option>
                                <option value="Gudang">Gudang</option>
                                <option value="HSE">HSE</option>
                                <option value="Revisi QC STG 1">Revisi QC STG 1</option>
                                <option value="Produksi STG 1">Produksi STG 1</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Deskripsi</label>
                            <textarea class="form-control" id="modalDeskripsi" rows="3"></textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="button" class="btn btn-success" id="btnSetujuiMemo">
                        <i class="fa-solid fa-check me-1"></i> Setujui
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../../js/supabase.js"></script>
    <script src="../../../js/module/operations/stg/memo.js"></script>
</body>
</html>
