<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Barang Keluar - DMB ERP</title>

    <!-- ============================================================
         KELOMPOK 1: LIBRARY & STYLE
         Fungsi: Bootstrap (hanya untuk modal), ikon Font Awesome, font Inter,
         dan seluruh gaya halaman (ditulis di sini, tanpa CSS proyek).
         Prefix "ct-" = gaya halaman, "mi-" = isi modal.
         ============================================================ -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --ct-primary: #2b6cb0;
            --ct-primary-dark: #1e4e8c;
            --ct-bg-soft: #e1ecf5;
            --ct-border: #d3dfea;
            --ct-text-main: #1f2d3d;
            --ct-text-muted: #6b7c93;
            --ct-danger: #d64545;
            --ct-radius: 8px;
            --ct-head-h: 40px;           /* tinggi satu baris header tabel (header 2 tingkat) */
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            display: flex; flex-direction: column;
            font-family: 'Inter', sans-serif; background: #f4f7fb; color: var(--ct-text-main);
        }

        /* --- Bar atas --- */
        .ct-topbar {
            display: flex; align-items: center; justify-content: space-between; gap: 16px;
            padding: 14px 24px; background: #fff; border-bottom: 1px solid var(--ct-border); flex-shrink: 0;
        }
        .btn-back {
            display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: var(--ct-radius);
            border: 1px solid var(--ct-border); background: var(--ct-bg-soft); color: var(--ct-primary-dark);
            font-size: 14px; font-weight: 600; text-decoration: none; transition: background 0.15s ease;
        }
        .btn-back:hover { background: var(--ct-primary); color: #fff; }
        .ct-tabs { display: flex; gap: 6px; background: var(--ct-bg-soft); padding: 4px; border-radius: 10px; }
        .ct-tabs[hidden] { display: none; }
        .ct-tab {
            border: none; background: transparent; padding: 7px 20px; border-radius: 7px;
            font-size: 14px; font-weight: 600; color: var(--ct-text-muted); cursor: pointer; font-family: inherit;
        }
        .ct-tab:hover { color: var(--ct-primary-dark); }
        .ct-tab.active { background: var(--ct-primary); color: #fff; }

        /* --- Area utama & judul --- */
        .ct-main { display: flex; flex-direction: column; flex: 1; min-height: 0; padding: 16px 24px; overflow: hidden; }
        .ct-title-block { text-align: center; margin-bottom: 14px; flex-shrink: 0; }
        .ct-title { margin: 0; font-size: 24px; font-weight: 700; }
        .ct-subtitle { margin-top: 2px; font-size: 16px; font-weight: 600; color: var(--ct-primary); }

        /* --- Toolbar: search, filter, tombol Barang Keluar --- */
        .ct-toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; flex-shrink: 0; }
        .ct-toolbar-spacer { flex: 1; }
        .ct-search-wrapper { position: relative; flex: 1; max-width: 360px; min-width: 200px; }
        .ct-search-wrapper i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ct-text-muted); font-size: 13px; }
        .ct-search-input {
            width: 100%; border: 1px solid var(--ct-border); border-radius: var(--ct-radius);
            padding: 8px 12px 8px 34px; font-size: 14px; outline: none; background: #fff; font-family: inherit;
        }
        .ct-search-input:focus { border-color: var(--ct-primary); }
        .btn-tool {
            display: inline-flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--ct-border);
            border-radius: var(--ct-radius); padding: 8px 16px; font-size: 14px; color: var(--ct-text-main);
            cursor: pointer; font-family: inherit;
        }
        .btn-tool:hover { border-color: var(--ct-primary); color: var(--ct-primary-dark); }
        .btn-tool:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-action {
            display: inline-flex; align-items: center; gap: 8px; padding: 9px 18px; border-radius: var(--ct-radius);
            border: 1px solid var(--ct-primary); background: var(--ct-primary); color: #fff;
            font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
        }
        .btn-action:hover { background: var(--ct-primary-dark); border-color: var(--ct-primary-dark); }
        .btn-action:disabled { opacity: 0.6; cursor: not-allowed; }

        /* --- Panel filter --- */
        .ct-filter-wrapper { position: relative; }
        .filter-count-badge { background: var(--ct-primary); color: #fff; font-size: 11px; font-weight: 600; border-radius: 999px; padding: 1px 7px; }
        .ct-filter-panel {
            position: absolute; top: calc(100% + 6px); left: 0; width: 320px; background: #fff;
            border: 1px solid var(--ct-border); border-radius: var(--ct-radius);
            box-shadow: 0 8px 24px rgba(31, 45, 61, 0.12); z-index: 60; max-height: 480px; overflow-y: auto;
        }
        .ct-filter-panel[hidden] { display: none; }
        .filter-group { border-bottom: 1px solid var(--ct-border); padding: 4px 14px; }
        .filter-group-header {
            width: 100%; display: flex; align-items: center; justify-content: space-between; background: none; border: none;
            padding: 10px 0; font-size: 12.5px; font-weight: 700; color: var(--ct-text-main); cursor: pointer; font-family: inherit;
        }
        .filter-group-header i { font-size: 11px; color: var(--ct-text-muted); transition: transform 0.15s ease; }
        .filter-group-header.expanded i { transform: rotate(180deg); }
        .filter-group-body { display: none; flex-direction: column; padding-bottom: 10px; }
        .filter-group-body.expanded { display: flex; }
        .filter-inline-search { width: 100%; border: 1px solid var(--ct-border); border-radius: 6px; padding: 6px 10px; font-size: 12.5px; outline: none; margin-bottom: 8px; font-family: inherit; }
        .filter-inline-search:focus { border-color: var(--ct-primary); }
        .filter-checkbox-list { max-height: 160px; overflow-y: auto; }
        .filter-checkbox-item { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 13px; cursor: pointer; }
        .filter-checkbox-item input { accent-color: var(--ct-primary); cursor: pointer; }
        .filter-panel-footer {
            display: flex; justify-content: space-between; padding: 10px 14px; border-top: 1px solid var(--ct-border);
            background: var(--ct-bg-soft); position: sticky; bottom: 0;
        }
        .btn-filter-reset { background: none; border: none; font-size: 13px; color: var(--ct-text-muted); cursor: pointer; font-family: inherit; }
        .btn-filter-reset:hover { color: var(--ct-danger); }
        .btn-filter-apply { background: var(--ct-primary); color: #fff; border: none; border-radius: 6px; padding: 6px 16px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; }
        .btn-filter-apply:hover { background: var(--ct-primary-dark); }

        /* --- Tabel utama (header 2 tingkat, sticky) --- */
        .ct-table-wrapper { background: #fff; border: 1px solid var(--ct-border); border-radius: var(--ct-radius); overflow: auto; flex: 1; min-height: 0; }
        .ct-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13.5px; }
        .ct-table thead th {
            position: sticky; z-index: 10; height: var(--ct-head-h); background: var(--ct-bg-soft); color: var(--ct-text-main);
            font-weight: 600; text-align: left; padding: 0 14px; white-space: nowrap; border-bottom: 1px solid var(--ct-border);
        }
        .ct-table thead tr:first-child th { top: 0; }
        .ct-table thead tr:nth-child(2) th { top: var(--ct-head-h); border-bottom: 2px solid var(--ct-border); }
        .ct-table thead th.th-span-2 { border-bottom: 2px solid var(--ct-border); }
        .ct-table thead th.th-group { text-align: center; }
        .ct-table tbody td { padding: 9px 14px; border-bottom: 1px solid var(--ct-border); vertical-align: middle; white-space: nowrap; }
        .ct-table tbody tr.row-clickable { cursor: pointer; }
        .ct-table tbody tr.row-clickable:hover { background: #f7fafc; }
        .ct-table tbody tr.row-group td { background: #f0f5fa; font-weight: 700; font-size: 13px; color: var(--ct-primary-dark); padding: 8px 14px; }
        .col-no { width: 50px; text-align: center !important; }
        .col-qty { text-align: right !important; min-width: 80px; }
        .qty-zero { color: var(--ct-text-muted); }
        .badge-status { display: inline-block; padding: 3px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; }
        .badge-new { background: #d1fae5; color: #065f46; }
        .badge-second { background: #fef3c7; color: #92400e; }
        .row-loading td, .row-empty td { text-align: center !important; padding: 30px !important; color: var(--ct-text-muted); white-space: normal !important; }
        .data-empty-cell { color: var(--ct-text-muted); font-style: italic; }

        /* --- Pagination --- */
        .ct-pagination { display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 12px; flex-shrink: 0; min-height: 34px; }
        .pagination-btn {
            min-width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--ct-border); background: #fff; border-radius: 6px; font-size: 13px;
            color: var(--ct-text-main); cursor: pointer; font-family: inherit;
        }
        .pagination-btn:hover { border-color: var(--ct-primary); }
        .pagination-btn.active { background: var(--ct-primary); border-color: var(--ct-primary); color: #fff; }
        .pagination-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .ct-page-info { font-size: 12.5px; color: var(--ct-text-muted); margin-left: 10px; }

        /* --- Modal --- */
        .md-label { font-size: 12.5px; font-weight: 600; color: var(--ct-text-muted); margin-bottom: 4px; display: block; }
        .md-input {
            width: 100%; border: 1px solid var(--ct-border); border-radius: 6px; padding: 7px 9px; font-size: 13.5px;
            color: var(--ct-text-main); background: #fff; outline: none; font-family: inherit;
        }
        .md-input:focus { border-color: var(--ct-primary); }
        .md-input[readonly], .md-input:disabled { background: #f4f7fb; }
        .md-hint { font-size: 11.5px; color: var(--ct-text-muted); margin-top: 3px; }
        .mi-table-wrapper { overflow-x: auto; }
        .mi-table { width: 100%; min-width: 1120px; border-collapse: separate; border-spacing: 0; font-size: 13.5px; }
        .mi-table thead th { background: var(--ct-bg-soft); padding: 8px; font-weight: 600; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--ct-border); }
        .mi-table thead tr:nth-child(2) th { border-bottom: 2px solid var(--ct-border); text-align: center; }
        .mi-table thead th.th-span-2 { border-bottom: 2px solid var(--ct-border); }
        .mi-table thead th.th-group { text-align: center; }
        .mi-table tbody td { padding: 6px; border-bottom: 1px solid var(--ct-border); vertical-align: middle; }
        .mi-table tbody tr.row-invalid td { background: #fdecec; }
        .mi-table tbody tr.row-placeholder td { text-align: center; padding: 26px; color: var(--ct-text-muted); }
        .mi-no { width: 40px; text-align: center; color: var(--ct-text-muted); }
        .col-w-kode { min-width: 190px; }
        .col-w-nama { min-width: 190px; }
        .col-w-qty { min-width: 100px; width: 110px; }
        .col-calc { min-width: 90px; text-align: right; padding-right: 12px !important; font-variant-numeric: tabular-nums; }
        .sisa-neg { color: #d10000; font-weight: 700; }
        .col-w-satuan { min-width: 80px; width: 90px; }
        .mi-thumb { width: 44px; height: 44px; object-fit: cover; border: 1px solid var(--ct-border); border-radius: 6px; display: block; }
        .mi-count { font-size: 12.5px; color: var(--ct-text-muted); }
        .seg { display: inline-flex; border: 1px solid var(--ct-border); border-radius: 6px; overflow: hidden; white-space: nowrap; }
        .seg button { border: none; background: #fff; padding: 6px 12px; font-size: 13px; cursor: pointer; color: var(--ct-text-muted); font-family: inherit; }
        .seg button.active[data-val="true"] { background: #d1fae5; color: #065f46; font-weight: 600; }
        .seg button.active[data-val="false"] { background: #fef3c7; color: #92400e; font-weight: 600; }
        .seg.jenis button.active { background: var(--ct-primary); color: #fff; font-weight: 600; }
        .seg.disabled { opacity: 0.65; pointer-events: none; }

        /* Daftar saran Kode Barang & menu tombol "Tambah" (melayang di atas modal) */
        .ks-box {
            position: fixed; z-index: 1100; background: #fff; border: 1px solid var(--ct-border); border-radius: 6px;
            box-shadow: 0 8px 24px rgba(31, 45, 61, 0.18); max-height: 260px; overflow-y: auto;
        }
        .ks-item { padding: 8px 12px; font-size: 13px; cursor: pointer; border-bottom: 1px solid #eef2f6; }
        .ks-item:last-child { border-bottom: none; }
        .ks-item.active, .ks-item:hover { background: var(--ct-bg-soft); }
        .ks-empty { padding: 10px 12px; font-size: 13px; color: var(--ct-text-muted); }

        @media (max-width: 640px) {
            .ct-topbar, .ct-main { padding-left: 12px; padding-right: 12px; }
            .ct-filter-panel { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- ============================================================
         KELOMPOK 2: BAR ATAS
         Fungsi: tombol "Kembali" ke catalog.html (kiri) dan tab cabang (kanan).
         Tab hanya tampil untuk role Maintenance dan Superadmin (diatur JS).
         ============================================================ -->
    <header class="ct-topbar">
        <a href="../assets/catalog.html" class="btn-back" id="btnBack"><i class="fa-solid fa-arrow-left"></i> Kembali</a>
        <div class="ct-tabs" id="branchTabs" role="tablist" hidden>
            <button type="button" class="ct-tab active" data-branch="1" role="tab">Makassar</button>
            <button type="button" class="ct-tab" data-branch="2" role="tab">Surabaya</button>
        </div>
    </header>

    <main class="ct-main">

        <!-- KELOMPOK 3: JUDUL (baris kedua berganti sesuai cabang, diatur JS) -->
        <div class="ct-title-block">
            <h1 class="ct-title">Data Barang Keluar</h1>
            <div class="ct-subtitle" id="branchTitle">Makassar</div>
        </div>

        <!-- ========================================================
             KELOMPOK 4: TOOLBAR
             Fungsi: Search, Filter (Departemen, Area, Periode, Kategori),
             dan tombol "Barang Keluar" untuk membuka modal input.
             ======================================================== -->
        <div class="ct-toolbar">
            <div class="ct-search-wrapper">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" class="ct-search-input" id="searchInput" placeholder="Cari kode, nama, kategori barang..." autocomplete="off">
            </div>

            <div class="ct-filter-wrapper">
                <button type="button" class="btn-tool" id="btnFilterToggle">
                    <i class="fa-solid fa-filter"></i><span>Filter</span>
                    <span class="filter-count-badge" id="filterCountBadge" hidden>0</span>
                </button>
                <div class="ct-filter-panel" id="filterPanel" hidden>
                    <div id="filterGroups"></div>
                    <div class="filter-panel-footer">
                        <button type="button" class="btn-filter-reset" id="btnFilterReset">Reset</button>
                        <button type="button" class="btn-filter-apply" id="btnFilterApply">Terapkan</button>
                    </div>
                </div>
            </div>

            <div class="ct-toolbar-spacer"></div>

            <button type="button" class="btn-action" id="btnBarangKeluar"><i class="fa-solid fa-arrow-right-from-bracket"></i> Barang Keluar</button>
        </div>

        <!-- ========================================================
             KELOMPOK 5: TABEL UTAMA
             Fungsi: riwayat barang keluar, dikelompokkan per area, tanggal
             terbaru di atas. Header 2 tingkat dan sticky.
             ======================================================== -->
        <div class="ct-table-wrapper">
            <table class="ct-table">
                <thead>
                    <tr>
                        <th rowspan="2" class="th-span-2 col-no">No</th>
                        <th rowspan="2" class="th-span-2">Tanggal</th>
                        <th rowspan="2" class="th-span-2">Kode Barang</th>
                        <th rowspan="2" class="th-span-2">Nama Barang</th>
                        <th colspan="2" class="th-group">Qty Barang</th>
                        <th rowspan="2" class="th-span-2">Satuan</th>
                        <th rowspan="2" class="th-span-2">Status Barang</th>
                        <th rowspan="2" class="th-span-2">Kategori</th>
                        <th rowspan="2" class="th-span-2">Departemen</th>
                        <th rowspan="2" class="th-span-2">Area</th>
                        <th rowspan="2" class="th-span-2">Periode</th>
                    </tr>
                    <tr>
                        <th class="th-group">Baru</th>
                        <th class="th-group">Second</th>
                    </tr>
                </thead>
                <tbody id="stockOutTableBody">
                    <tr class="row-loading"><td colspan="12"><i class="fa-solid fa-spinner fa-spin"></i> Memuat data...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- KELOMPOK 6: PAGINATION (maksimal 100 baris per halaman) -->
        <div class="ct-pagination" id="stockOutPagination"></div>
    </main>

    <!-- ============================================================
         KELOMPOK 7: MODAL BARANG KELUAR (Input & Edit)
         Fungsi: satu modal untuk dua mode (diatur JS):
           - Input : pilih Request / Non-Request, isi data, isi tabel barang
           - Edit  : data batch tampil readonly; hanya Qty, Baru/Second, dan
                     hapus baris barang yang bisa diubah (Maintenance & Superadmin)
         ============================================================ -->
    <div class="modal fade" id="modalKeluar" tabindex="-1" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="mkTitle">Barang Keluar</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
                </div>
                <div class="modal-body">
                    <div id="mkMessage" class="alert d-none py-2 small" role="alert"></div>

                    <!-- Baris 1: Kode Batch + pilihan jenis, Tanggal, Kode Request -->
                    <div class="row g-3 mb-3">
                        <div class="col-lg-6">
                            <label class="md-label" for="fKodeBatch">Kode Batch</label>
                            <div class="d-flex gap-2 align-items-center flex-wrap">
                                <input type="text" class="md-input" id="fKodeBatch" readonly style="max-width: 190px;">
                                <div class="seg jenis" id="segJenis">
                                    <button type="button" data-val="true" class="active">Request</button>
                                    <button type="button" data-val="false">Non-Request</button>
                                </div>
                            </div>
                            <div class="md-hint" id="kodeBatchNote"></div>
                        </div>
                        <div class="col-lg-3 col-md-6">
                            <label class="md-label" for="fTanggal">Tanggal</label>
                            <input type="date" class="md-input" id="fTanggal">
                        </div>
                        <div class="col-lg-3 col-md-6" id="wrapKodeRequest">
                            <label class="md-label" for="fKodeRequest">Kode Request</label>
                            <select class="md-input" id="fKodeRequest"><option value="">Pilih Kode Request</option></select>
                            <input type="text" class="md-input d-none" id="fKodeRequestTxt" readonly>
                        </div>
                    </div>

                    <!-- Baris 2: Pemohon, Departemen, Area, Periode -->
                    <div class="row g-3 mb-3">
                        <div class="col-lg-4 col-md-6">
                            <label class="md-label" for="fPemohonSel">Pemohon</label>
                            <select class="md-input d-none" id="fPemohonSel"><option value="">Pilih Pemohon</option></select>
                            <input type="text" class="md-input" id="fPemohonTxt" readonly>
                        </div>
                        <div class="col-lg-3 col-md-6">
                            <label class="md-label" for="fDepartemen">Departemen</label>
                            <input type="text" class="md-input" id="fDepartemen" readonly>
                        </div>
                        <div class="col-lg-3 col-md-6">
                            <label class="md-label" for="fArea">Area</label>
                            <input type="text" class="md-input" id="fArea" readonly>
                        </div>
                        <div class="col-lg-2 col-md-6">
                            <label class="md-label" for="fPeriode">Periode Request</label>
                            <input type="text" class="md-input" id="fPeriode" readonly>
                        </div>
                    </div>

                    <!-- Tabel barang -->
                    <div class="mi-table-wrapper">
                        <table class="mi-table">
                            <thead>
                                <tr>
                                    <th rowspan="2" class="th-span-2 mi-no">No</th>
                                    <th rowspan="2" class="th-span-2 col-w-kode">Kode Barang</th>
                                    <th rowspan="2" class="th-span-2 col-w-nama">Nama Barang</th>
                                    <th rowspan="2" class="th-span-2">Baru / Second</th>
                                    <th colspan="3" class="th-group">Qty</th>
                                    <th rowspan="2" class="th-span-2 col-w-satuan">Satuan</th>
                                    <th rowspan="2" class="th-span-2">Foto Barang</th>
                                    <th rowspan="2" class="th-span-2">Aksi</th>
                                </tr>
                                <tr>
                                    <th id="thQtyInput">Permintaan</th>
                                    <th>Stock</th>
                                    <th>Sisa Stock</th>
                                </tr>
                            </thead>
                            <tbody id="mkTbody"></tbody>
                        </table>
                    </div>
                    <div class="d-flex justify-content-end mt-2">
                        <button type="button" class="btn btn-outline-primary btn-sm d-none" id="btnTambahItem"><i class="fa-solid fa-plus"></i> Tambah</button>
                    </div>
                </div>
                <div class="modal-footer justify-content-between">
                    <span class="mi-count" id="mkCount"></span>
                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Batal</button>
                        <button type="button" class="btn btn-primary" id="btnMkSimpan"><i class="fa-solid fa-floppy-disk"></i> Simpan</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================================
         KELOMPOK 8: SCRIPT
         Fungsi: Bootstrap (modal), Supabase (database), lalu barang_keluar.js.
         PERLU DICEK: path supabase.js dan barang_keluar.js. Samakan dengan
         path yang sudah berjalan di barang_masuk.html Anda.
         ============================================================ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
